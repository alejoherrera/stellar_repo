[project]
name = "monitor-as-a-service"
version = "1.0.3"
description = "Reference Python SDK for the Monitor as a Service Open Schema v1 (Stellar + IPFS). Powered by Mivisor.com."
readme = "README.md"
license = { text = "MIT" }
# Truco: PyPI sidebar muestra solo el primer entry del array; combinamos los 3
# coautores en un solo string para que todos aparezcan visibles en la pagina del paquete.
# La metadata Author-email igual lleva los emails individuales (vease tooling).
authors = [
    { name = "Juan Alejandro Herrera Lopez, Andres Herrera Monge (CEO Mivisor.com), Claude (Anthropic AI assistant)", email = "alejandroherreracr@gmail.com" },
]
maintainers = [
    { name = "Juan Alejandro Herrera Lopez & Andres Herrera Monge (CEO Mivisor.com)", email = "alejandroherreracr@gmail.com" },
]
requires-python = ">=3.9"
dependencies = ["requests>=2.28"]

[project.urls]
Homepage = "https://www.obrapublica.info/stellar/dev"
Schema = "https://github.com/alejoherrera/stellar_repo/blob/main/docs/SCHEMA.md"
Source = "https://github.com/alejoherrera/stellar_repo/tree/main/sdk/py"

[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["monitor_as_a_service*"]
